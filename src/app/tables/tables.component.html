<mat-checkbox [(ngModel)]="showMessage">Show Message</mat-checkbox>

<div class="tables">
  <div>
    <h2>All Boxes</h2>

    <table transition mat-table [dataSource]="boxes() | withTransition">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>
          <span transition="id-header">Id</span>
        </th>
        <td mat-cell *matCellDef="let element">
          <span [transition]="'id-' + element.id">{{ element.id }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="label">
        <th mat-header-cell *matHeaderCellDef>
          <span transition="label-header">Label</span>
        </th>
        <td mat-cell *matCellDef="let element">
          <span [transition]="'label-' + element.id">{{ element.label }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="message">
        <th mat-header-cell *matHeaderCellDef>
          <span transition="message-header">Message</span>
        </th>
        <td mat-cell *matCellDef="let element">
          <span [transition]="'message-' + element.id">{{
            element.message
          }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element">
          <div class="actions">
            <button [transition]="'action-' + element.id" mat-icon-button (click)="toggleEdit(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button (click)="delete(element)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="edit">
        <td
          mat-cell
          *matCellDef="let element"
          [colSpan]="columns().length | withTransition"
        >
          <div class="form">
            <mat-form-field>
              <mat-label>Label</mat-label>
              <input matInput [(ngModel)]="element.label" />
            </mat-form-field>

            <mat-form-field>
              <mat-label>Message</mat-label>
              <input matInput [(ngModel)]="element.message" />
            </mat-form-field>

            <button
              mat-icon-button
              class="save-button"
              (click)="toggleEdit(element)"
              [transition]="'action-' + element.id"
            >
              <mat-icon>save</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns() | withTransition"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: ['edit']; when: isEditing"
        [transition]="'box-' + row.id"
      ></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: columns() | withTransition"
        [transition]="'box-' + row.id"
      ></tr>
    </table>
  </div>

  <div>
    <h2>Recently Deleted Boxes</h2>

    <table transition mat-table [dataSource]="deletedBoxes() | withTransition">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>
          <span transition="del-id-header">Id</span>
        </th>
        <td mat-cell *matCellDef="let element">
          <span [transition]="'id-' + element.id">{{ element.id }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="label">
        <th mat-header-cell *matHeaderCellDef>
          <span transition="del-label-header">Label</span>
        </th>
        <td mat-cell *matCellDef="let element">
          <span [transition]="'label-' + element.id">{{ element.label }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="message">
        <th mat-header-cell *matHeaderCellDef>
          <span transition="del-message-header">Message</span>
        </th>
        <td mat-cell *matCellDef="let element">
          <span [transition]="'message-' + element.id">{{
            element.message
          }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element">
          <button
            mat-icon-button
            (click)="restore(element)"
            [transition]="'action-' + element.id"
          >
            <mat-icon>undo</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns() | withTransition"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: columns() | withTransition"
        [transition]="'box-' + row.id"
      ></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell placeholder" [attr.colspan]="columns().length">
          No recently deleted rows
        </td>
      </tr>
    </table>
  </div>
</div>
